plugins {
  id 'application'
  id 'java'
  id 'jacoco'
  id 'pmd'
  id 'checkstyle'
  id 'com.github.spotbugs' version '6.0.7'
  id 'com.diffplug.spotless' version '6.25.0'
  id 'org.flywaydb.flyway' version '7.15.0'
  id "com.qqviaja.gradle.MybatisGenerator" version "2.5"
  id 'org.springframework.boot' version '3.3.3'
  id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.service.system.dmc'
version = '0.0.1-SNAPSHOT'

configurations {
    mybatisGenerator
    compileOnly {
        extendsFrom annotationProcessor
    }
}

java {
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

repositories {
  mavenCentral()
}

dependencies {
  // implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-configuration-processor'
  implementation 'org.mybatis.generator:mybatis-generator-core:1.4.2'
  implementation 'mysql:mysql-connector-java:8.0.33'

  annotationProcessor 'org.projectlombok:lombok:1.18.30'
  compileOnly 'org.projectlombok:lombok:1.18.30'
  
  testImplementation('org.springframework.boot:spring-boot-starter-test') {
    exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
  }
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
  mainClass = 'com.service.system.dmc.App'
}

mybatisGenerator {
    verbose = true
    configFile = 'config/mybatis/generatorConfig.xml'
    
    // optional, here is the override dependencies for the plugin or you can add other database dependencies.
    dependencies {
        mybatisGenerator 'com.itfsw:mybatis-generator-plugin:1.3.7'
        mybatisGenerator 'org.mybatis.generator:mybatis-generator-core:1.4.2'
        mybatisGenerator 'mysql:mysql-connector-java:8.0.33'
    }
}

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

spotless {
  java {
    googleJavaFormat() 
    importOrder()
    removeUnusedImports()
    trimTrailingWhitespace()
    endWithNewline()
  }
}

jacoco {
  toolVersion = "0.8.11"
}

test {
  useJUnitPlatform() 
  ignoreFailures = true
  finalizedBy jacocoTestReport
}

jacocoTestReport {
  dependsOn test
  reports {
    html.required = true
    xml.required = true
  }
}

pmd {
  toolVersion = "7.5.0"
  ignoreFailures = true
}

spotbugs {
  toolVersion.set('4.8.0')
  ignoreFailures.set(true)
  showStackTraces.set(false)
}

checkstyle {
  toolVersion = '10.12.5'
  configFile = file("config/checkstyle/google_checks.xml")
  ignoreFailures = true
  showViolations = false
}

flyway {
    url = 'jdbc:mysql://localhost:3306/world?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8'
    user = 'developer'
    password = 'password'
    locations = ['filesystem:./database/world/migration']
}
spotbugsTest.enabled = false
pmdTest.enabled = false
checkstyleTest.enabled = false
